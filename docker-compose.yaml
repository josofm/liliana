services:
  liliana:
    image: liliana:latest
    build:
      context: .
      target: devimage
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: test
      HTTP_PORT: 8080
      LOG_LEVEL: debug
      JWT_SECRET_KEY: test-secret
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 168h
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      AUTO_MIGRATE: "false"
      DATABASE_URL: postgres://liliana:liliana@postgres:5432/liliana_test?sslmode=disable
      LILIANA_POSTGRES_TEST_DSN: postgres://liliana:liliana@postgres:5432/liliana_test?sslmode=disable
    ports:
      - "${HTTP_PORT:-8080}:8080"

  migrate:
    image: liliana:latest
    build:
      context: .
      target: devimage
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://liliana:liliana@postgres:5432/liliana_test?sslmode=disable
    command: ["go", "run", "./cmd/migrate", "up"]
    profiles:
      - tools

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: liliana
      POSTGRES_PASSWORD: liliana
      POSTGRES_DB: liliana_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liliana -d liliana_test"]
      interval: 5s
      timeout: 5s
      retries: 5
